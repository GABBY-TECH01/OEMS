<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="sunGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="panelGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadowM" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Full-bleed background for maskable icon -->
  <rect width="512" height="512" fill="url(#bgMask)"/>

  <!-- Centered Safe Zone Group (scaled 78% into center safe circle) -->
  <g transform="translate(56, 56) scale(0.78)">
    <!-- Sun -->
    <g filter="url(#shadowM)">
      <circle cx="256" cy="180" r="82" fill="url(#sunGradM)"/>
      <path d="M256 68 L256 44 M256 292 L256 316 M144 180 L120 180 M368 180 L392 180 M177 101 L160 84 M335 259 L352 276 M177 259 L160 276 M335 101 L352 84" 
            stroke="url(#sunGradM)" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- Solar Panel -->
    <g filter="url(#shadowM)" transform="translate(0, 30)">
      <polygon points="126,290 386,290 426,410 86,410" fill="#0f172a" stroke="#10b981" stroke-width="6"/>
      <polygon points="138,300 250,300 248,346 122,346" fill="url(#panelGradM)"/>
      <polygon points="262,300 374,300 390,346 264,346" fill="url(#panelGradM)"/>
      <polygon points="118,354 246,354 244,400 96,400" fill="url(#panelGradM)"/>
      <polygon points="266,354 394,354 416,400 268,400" fill="url(#panelGradM)"/>
      <line x1="256" y1="294" x2="256" y2="406" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
      <line x1="110" y1="350" x2="402" y2="350" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Bolt -->
    <path d="M272 150 L238 214 L266 214 L244 278 L290 202 L260 202 Z" 
          fill="#ffffff" filter="url(#shadowM)"/>

    <!-- OFFNOT ENERGY -->
    <text x="256" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" letter-spacing="6" fill="#f8fafc">
      OFFNOT
    </text>
    <text x="256" y="495" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" letter-spacing="4" fill="#34d399">
      ENERGY
    </text>
  </g>
</svg>
